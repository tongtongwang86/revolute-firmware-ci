# MCUboot image configuration (sysbuild child image).
CONFIG_KERNEL_BIN_NAME="Bootloader"

# disable downgrade prevention for development
CONFIG_BOOT_UPGRADE_ONLY=n
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION=n

# The board's zephyr,console is a USB CDC ACM node. MCUboot does not bring up
# the USB device stack, so leaving the console enabled makes uart_console.c
# reference a device that is never instantiated and the image fails to link
# with "undefined reference to __device_dts_ord_*". No console in the
# bootloader also keeps it small.
CONFIG_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n
