name: Compile Firmware

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 💾 Cache Zephyr Workspace
        uses: actions/cache@v4
        with:
          path: zephyr-workspace
          key: zephyr-workspace-v2-${{ runner.os }}-${{ hashFiles('zephyr-workspace/revolute-ci-app/west.yml') }}
          restore-keys: |
            zephyr-workspace-v2-${{ runner.os }}-

      - name: 🧹 Clean Landing Site
        run: rm -rf zephyr-workspace/revolute-ci-app

      - uses: actions/checkout@v4
        with:
          # Clone into a subdirectory so the Zephyr workspace can be
          # initialized in the parent directory.
          path: zephyr-workspace/revolute-ci-app

      - name: 💾 Cache ~/.venv
        uses: actions/cache@v4
        with:
          path: ~/.venv
          key: venv-${{ runner.os }}-${{ hashFiles('zephyr-workspace/zephyr/scripts/requirements.txt') }}
          restore-keys: |
            venv-${{ runner.os }}-

      - name: 🧰 Install Dependencies + West
        # Zephyr host build dependencies, per
        # https://docs.zephyrproject.org/latest/develop/getting_started/index.html
        run: |
          sudo apt update
          sudo apt install --no-install-recommends ccache ninja-build
          python3 -m venv ~/.venv
          source ~/.venv/bin/activate
          # Carry the venv PATH into subsequent steps
          echo "PATH=$PATH" >> $GITHUB_ENV
          pip3 install west ninja

      - name: 🪁 Install Zephyr SDK
        # Minimal SDK + the arm-zephyr-eabi toolchain only (Cortex-M); '-c'
        # installs the CMake packages.
        run: |
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.17.0/zephyr-sdk-0.17.0_linux-x86_64_minimal.tar.xz
          tar xf zephyr-sdk-0.17.0_linux-x86_64_minimal.tar.xz -C ~/
          ~/zephyr-sdk-0.17.0/setup.sh -c -t arm-zephyr-eabi

      - name: ♻️ Initialize Zephyr Workspace
        run: |
          cd zephyr-workspace
          rm -rf .west
          west init -l revolute-ci-app
          west update --narrow -o=--depth=1

      - name: 🐍 Install Python Dependencies
        run: |
          cd zephyr-workspace
          pip3 install -r zephyr/scripts/requirements.txt

      - name: 💾 Cache ~/.cache/ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-v1-${{ runner.os }}-${{ hashFiles('zephyr-workspace/revolute-ci-app/west.yml') }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-

      - name: 🔨 Build Project
        run: |
          cd zephyr-workspace
          ccache -z
          west build \
              --board revolutewireless \
              --pristine=always \
              --sysbuild \
              revolute-ci-app \
              -- \
              -DBOARD_ROOT="$GITHUB_WORKSPACE/zephyr-workspace/revolute-ci-app"
          ccache -sv

      - name: 🏷 Rename Files
        # Debugger flash uses the confirmed image (image-ok already set, so
        # slot0 boots without a revert). OTA uploads use the unpadded signed
        # image — the confirmed one is padded out to the full slot and carries
        # a trailer that must not be written into slot1.
        run: |
          cd zephyr-workspace/build/revolute-ci-app/zephyr
          cp revolute.signed.confirmed.hex revolutefirmware.hex
          cp revolute.signed.bin revolutefirmware.bin
          cp revolute.signed.bin firmware.revoluteconfig

      - name: 1. Save Bootloader (Erase and flash with debugger)📦
        uses: actions/upload-artifact@v4
        with:
          name: Bootloader
          path: zephyr-workspace/build/mcuboot/zephyr/Bootloader.hex
          compression-level: 0
          if-no-files-found: error

      - name: 2. Save Firmware (Flash with debugger)📦
        uses: actions/upload-artifact@v4
        with:
          name: RevoluteHex
          path: zephyr-workspace/build/revolute-ci-app/zephyr/revolutefirmware.hex
          compression-level: 0
          if-no-files-found: error

      - name: 3. Save OTA Update File (Flash with OTA)📦
        uses: actions/upload-artifact@v4
        with:
          name: RevoluteBin
          path: |
            zephyr-workspace/build/revolute-ci-app/zephyr/revolutefirmware.bin
            zephyr-workspace/build/revolute-ci-app/zephyr/firmware.revoluteconfig
          compression-level: 0
          if-no-files-found: error

  release:
    needs: build
    # Only publish from the default branch, not from pull requests.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: ⬇️ Download RevoluteBin artifact
        uses: actions/download-artifact@v4
        with:
          name: RevoluteBin
          path: artifacts

      - name: 🏷 Set Release Tag
        run: echo "TAG_NAME=OTA-Development-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_ENV

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Revolute OTA Firmware
          prerelease: true
          files: |
            artifacts/revolutefirmware.bin
            artifacts/firmware.revoluteconfig
