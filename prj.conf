CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_DYNAMIC_DB=y

# Buffers (new scheme for Zephyr 4.1+)
CONFIG_BT_BUF_ACL_TX_COUNT=10          
CONFIG_BT_BUF_EVT_RX_COUNT=12          

# ACL buffer size (max payload 251)
CONFIG_BT_BUF_ACL_TX_SIZE=251

# ATT / L2CAP tuning
CONFIG_BT_ATT_TX_COUNT=10
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_DATA_LEN_UPDATE=y

# Connection interval for high throughput (min 7.5ms).
# A min==max range is commonly rejected outright by centrals, so advertise a
# range instead; ble.c re-requests explicitly if the granted interval is slower.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Power
# REG1 DC/DC mode is enabled in the board devicetree (&reg1) and applied by the
# nRF52 SoC init from that property; no extra Kconfig needed.

# Fuel gauge power management. Without this the BQ27427 sits in its normal
# operating mode drawing ~100uA forever, which swamps the System OFF budget.
CONFIG_BQ274XX_PM=y

# ---------------------------------------------------------------------------
# OTA (MCUboot + MCUmgr over Bluetooth)
#
# Built with sysbuild, which pulls in MCUboot from sysbuild.conf. The image is
# signed and placed in slot0; mcumgr writes the update into slot1 and MCUboot
# swaps on the next boot. Flash layout comes from the board devicetree
# (boot/slot0/slot1/storage partitions).
# ---------------------------------------------------------------------------

# MCUmgr dependencies
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_MCUMGR=y
CONFIG_STREAM_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y

# Produce an MCUboot-compatible (signed, confirmed) image named revolute.*
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_GENERATE_CONFIRMED_IMAGE=y
CONFIG_KERNEL_BIN_NAME="revolute"

# Image management group — the one OTA actually needs
CONFIG_IMG_MANAGER=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y

# Bluetooth transport (unauthenticated, matching the previous OTA build)
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW=y
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_AUTHEN=n
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y

# Packet reassembly keeps DFU throughput usable at the HID-tuned MTU above
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2475
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4608